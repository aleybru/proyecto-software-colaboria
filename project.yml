####################################################
# PROJECT MANIFEST — L1
# Proyecto ColaborIA
####################################################

project:
  name: ColaborIA
  type: software
  description: >
    Plataforma que formaliza y automatiza la coordinación entre Dani,
    Papu, Chapu y runtimes de ejecución. ColaborIA es simultáneamente
    el producto y su propio POC de software mediante dogfooding.

scope:
  isolation: strict

repositories:
  governance:
    full_name: aleybru/proyecto-software-colaboria
    status: transitional_current_project_only
    purpose: >
      Infraestructura normativa e histórica del desarrollo actual de ColaborIA.
      No forma parte de la topología que ColaborIA crea para proyectos nuevos.
  code:
    full_name: aleybru/proyecto-software-colaboria-codigo
    purpose: código fuente de ColaborIA; monorepo backend/frontend.

drive:
  root_folder:
    name: "Proyecto ColaborIA"
    purpose: raíz documental actual del proyecto ColaborIA.

agents:
  chapu:
    enabled: true
    platform: Claude
  papu:
    enabled: true
    platform: ChatGPT

protocol:
  version: 1.0
  source: PROTOCOLO-OPERATIVO-MULTIPROYECTO-v1.md
  last_validated_at: 2026-07-06

decisiones_vigentes_del_proyecto:
  - id: DEC-C01
    resumen: ColaborIA es su propio POC de software mediante dogfooding.
  - id: DEC-C02
    resumen: >
      ColaborIA actualmente conserva repo de gobernanza y repo de código
      separados como infraestructura de su propio desarrollo. Esto no implica
      dos repos para proyectos nuevos creados por la aplicación.
  - id: DEC-C03
    resumen: Bounded Auto solo para tareas con criterio de éxito verificable por máquina.
  - id: DEC-C04
    resumen: Efectos secundarios reales requieren autorización explícita de Dani.
  - id: DEC-C06
    resumen: Primer test de portabilidad de Chapu aprobado 9.5/10.
  - id: DEC-C08
    resumen: >
      Workflow transicional actual con Claude Code como ejecutor y code-tasks/
      en el repo de gobernanza de ColaborIA. No convierte al repo de gobernanza
      en recurso obligatorio de proyectos nuevos.
  - id: DEC-C09
    resumen: >
      REVISADA 2026-08-29. Postgres + project_resources. Topología base fija:
      todo proyecto crea automáticamente drive_root; software agrega un único
      code_repo GitHub; narrative no crea repo; governance_repo deprecado para
      proyectos nuevos. Alta UI: nombre + tipo solamente. Drive es raíz
      documental del proyecto; DB sostiene gobernanza/estado del producto.
  - id: DEC-C10
    resumen: >
      REVISADA 2026-08-29. Canal persistente con sessions/messages/agent_turns,
      floor lock e input_context_ref. DB es fuente durable de conversación y
      objetos formales del producto. QC/handoffs en repo quedan como transición
      del desarrollo actual de ColaborIA, no como recurso por proyecto.
  - id: DEC-C11
    resumen: >
      REVISADA 2026-08-29. ColaborIA es interfaz única. Persistencia objetivo:
      estado/gobernanza en DB, documentos en Drive, código en un único repo
      solo para software. Matriz: Papu DB R/W autorizada, Drive/código RO;
      Chapu DB/Drive/código R/W autorizada según recurso y aprobación.
  - id: DEC-C12
    resumen: >
      REVISADA 2026-08-29. Kanban/planificación viven operativa y durablemente
      en DB. code-tasks/*.md es mecanismo transicional del desarrollo actual,
      no requisito de proyectos nuevos ni fuente canónica futura.
  - id: DEC-C13
    resumen: >
      REVISADA 2026-08-29. Roadmap/timeline sobre el núcleo de planificación;
      jerarquía fase->iniciativa->hito->tarea; DB es fuente durable y Drive
      puede almacenar exportaciones/documentos derivados.
  - id: DEC-C14
    resumen: >
      Mapa de tramas y estructura de presentación narrativa: episodio/acto/beat,
      orden del relato, tiempo de pantalla estimado y relaciones semánticas.
  - id: DEC-C15
    resumen: >
      Cronología interna del mundo narrativo, separada de la presentación y
      del calendario real de producción.
  - id: DEC-C16
    resumen: >
      REVISADA 2026-08-29. MVP1.0: crear proyecto con nombre+tipo; Drive siempre;
      software además un único repo de código; narrative solo Drive; sin repo
      de gobernanza por proyecto ni selectores kind/provider. OAuth Drive debe
      recuperarse desde UI. Estado formal durable en DB; documentos en Drive;
      código en repo software. Criterio de cierre actualizado a este flujo.
  - id: DEC-C17
    resumen: >
      UI/UX Engine conceptual: Design Result versionado, prototipos funcionales
      en sandbox y posterior implementación Angular con verificación.
  - id: DEC-C18
    resumen: >
      Explorer Engine conceptual para explorar ideas y producir recomendaciones;
      Dani conserva el go/no-go final.

rol_chapu_en_este_proyecto:
  prioridades:
    - consistencia longitudinal entre decisiones y código
    - arquitectura técnica
    - impacto acumulativo de cambios
    - recuperación histórica de decisiones
    - revisión de divergencias entre documentación e implementación

rol_papu_en_este_proyecto:
  prioridades:
    - arquitectura conceptual y técnica
    - dominio y boundaries
    - workflows y modelos de datos
    - contexto, trazabilidad, seguridad y trade-offs
